[workspace]
members = ["apps/desktop/src-tauri", "crates/mcp", "crates/protocol", "crates/host-client", "crates/host", "crates/project", "crates/editor", "crates/storage", "crates/assets", "crates/review", "crates/jobs", "crates/speech", "crates/media", "crates/scene", "crates/render"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[profile.release]
debug = 0
incremental = true
lto = "off"
codegen-units = 16

[profile.dist]
inherits = "release"
incremental = false
lto = "thin"
codegen-units = 1

[workspace.dependencies]
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
schemars = "=1.2.2"
ts-rs = "=12.0.1"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "process", "signal", "sync"] }
libc = "=0.2.189"
uuid = { version = "=1.26.1", features = ["v4"] }
sha2 = { version = "=0.10.9", features = ["asm"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
sungeki-storage = { path = "crates/storage" }
sungeki-project = { path = "crates/project" }
sungeki-editor = { path = "crates/editor" }
sungeki-protocol = { path = "crates/protocol" }
sungeki-host-client = { path = "crates/host-client" }
sungeki-assets = { path = "crates/assets" }
sungeki-review = { path = "crates/review" }
sungeki-jobs = { path = "crates/jobs" }
sungeki-speech = { path = "crates/speech" }
sungeki-media = { path = "crates/media" }
sungeki-scene = { path = "crates/scene" }
sungeki-render = { path = "crates/render" }
